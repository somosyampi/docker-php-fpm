name: Build and test Docker multiplatform images

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      image:
        required: true
        type: string
      build-args:
        required: false
        default: ''
        type: string

jobs:
  docker:
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      -
        name: Build image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:${{ inputs.image }}"
          platforms: "${{ inputs.platform }}"
          build-args: "${{ inputs.build-args }}"
          load: true
          tags: somosyampi/docker-php-fpm:${{ inputs.image }}-test
          cache-from: type=registry,ref=somosyampi/docker-php-fpm:${{ inputs.image }}-buildcache-${{ inputs.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          cache-to: type=registry,ref=somosyampi/docker-php-fpm:${{ inputs.image }}-buildcache-${{ inputs.platform == 'linux/arm64' && 'arm64' || 'amd64' }},mode=max
      -
        name: Test image
        run: |
          docker image inspect somosyampi/docker-php-fpm:${{ inputs.image }}-test
          docker run --rm somosyampi/docker-php-fpm:${{ inputs.image }}-test php -i
      -
        name: Scan for vulnerabilities
        uses: crazy-max/ghaction-container-scan@v3
        with:
          image: somosyampi/docker-php-fpm:${{ inputs.image }}-test
          annotations: true
          dockerfile: ./${{ inputs.image }}/Dockerfile
